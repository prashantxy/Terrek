name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare binary
        shell: bash
        run: |
          mkdir release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/terrek.exe release/terrek-${{ matrix.os }}.exe
          else
            cp target/release/terrek release/terrek-${{ matrix.os }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
