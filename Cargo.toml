[package]
name = "terrek"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "An AI layer for the shell you already use: remembers every command, explains failures, answers questions in context."
license = "MIT"
repository = "https://github.com/prashantxy/Terrek"
readme = "README.md"
keywords = ["terminal", "shell", "ai", "cli", "history"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["bridges/", "docs/assets/"]

[[bin]]
name = "terrek"
path = "src/main.rs"

[features]
default = ["integrations"]
# Slack / Discord / Telegram / email / X / WhatsApp-bridge senders.
integrations = ["dep:lettre"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6.0"
fuzzy-matcher = "0.3"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7.3"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
strip-ansi-escapes = "0.2"
tempfile = "3.10"
toml = "0.9"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }

lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
