[package]
name = "terrek"
version = "0.1.0"
edition = "2021"          # Changed from 2024 (2024 is not stable yet)

[[bin]]
name = "terrek"
path = "src/main.rs"

[dependencies]
tui = "0.19"
crossterm = "0.27"
portable-pty = "0.9.0"
anyhow = "1.0"
chrono = "0.4"
termios = "0.3"
uuid = { version = "1.0", features = ["v4"] }
rusqlite = "0.38"
scopeguard = "1.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
dirs = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde_json = "1.0"
rustyline = "17.0"
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
fuzzy-matcher = "0.3"
urlencoding = "2.1"
lettre = { version = "0.11", features = ["smtp-transport", "builder", "rustls-tls"] }
roux = "2.2.15"
