[package]
name = "terrek"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "terrek"
path = "src/main.rs"


[dependencies]
tui = "0.19"           # TUI library for layouts and widgets
crossterm = "0.27"
portable-pty = "0.9.0"
anyhow = "1.0.100"
chrono = "0.4.43"
termios = "0.3.3"
uuid = { version = "1.20.0", features = ["v4"] }
rusqlite = "0.38.0"
scopeguard = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.12"
dirs = "6.0.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0.149"

